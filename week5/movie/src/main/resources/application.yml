spring:
  application:
    name: umc-movie
  config:
    # DB 비밀번호 같은 값은 프로젝트 루트의 .env에서 읽어요. (.env는 Git에 올리지 않아요)
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/umc_movie
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Workbench(또는 sql/01_schema.sql)로 만든 테이블을 그대로 쓰고, 엔티티와 구조가 맞는지만 검사해요.
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
